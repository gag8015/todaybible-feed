name: diag
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Keyed request
        env:
          KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.parse, urllib.request, datetime as dt
          k = os.environ["KEY"].strip()
          k = k if "%" in k else urllib.parse.quote(k, safe="")
          d = (dt.datetime.utcnow() + dt.timedelta(hours=9) - dt.timedelta(hours=3)).strftime("%Y%m%d")
          q = f"serviceKey={k}&pageNo=1&numOfRows=10&dataType=JSON&base_date={d}&base_time=0500&nx=60&ny=127"
          for scheme in ("https", "http"):
              t = time.time()
              try:
                  with urllib.request.urlopen(f"{scheme}://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?{q}", timeout=40) as r:
                      print(scheme, r.status, round(time.time() - t, 2), r.read(160))
              except Exception as e:
                  print(scheme, "ERR", round(time.time() - t, 2), type(e).__name__, str(e)[:120])
          PY
