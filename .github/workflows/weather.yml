# 오늘성경 날씨 파일: 기상청 단기예보를 하루 4번 받아 GitHub Pages에 weather.json으로 올린다.
# 필요한 설정: 저장소 Settings > Secrets and variables > Actions > KMA_SERVICE_KEY,
#              Settings > Pages > Source = GitHub Actions.
# 실패하면 배포하지 않으므로 직전 weather.json이 그대로 남는다.
name: weather

on:
  schedule:
    # KST 05:20, 11:20, 17:20, 23:20 (= UTC 20:20, 02:20, 08:20, 14:20). 발표 05·11·17·23시 직후.
    - cron: "20 20,2,8,14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -I test_fetch.py
      - name: Fetch KMA forecast
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python -I fetch_kma.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
